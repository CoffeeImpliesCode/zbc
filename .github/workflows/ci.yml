name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig build test --summary all
      - run: zig build -Doptimize=ReleaseFast
      - name: Finding-regression check (tools/metrics)
        run: |
          zig build
          python3 tools/metrics/regress.py
